<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nurchashma — Asosiy</title>
  <meta name="description" content="Nurchashma — bolajonlar uchun xavfsiz va foydali multfilmlar, ertaklar va qo‘shiqlar.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/fonts/fredoka/index.css">
  <link rel="stylesheet" href="/vendor/fonts/nunito/index.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-home">
  <header class="site-header" id="site-header"></header>

  <main>
    <!-- Instagram/YouTube Shorts kabi so'nggi videolar lentasi -->
    <div class="shorts-main shorts-main--home">
      <div class="shorts-stage" id="stage">
        <div class="feed feed--chain" id="feed" tabindex="0" aria-label="So‘nggi videolar lentasi">
          <div class="feed__loading" aria-live="polite"><span class="feed__loading-cat" aria-hidden="true"></span><p>Yuklanmoqda...</p></div>
        </div>
        <div class="feed-nav">
          <button class="feed-nav__btn" type="button" id="prev" aria-label="Oldingi video">↑</button>
          <button class="feed-nav__btn" type="button" id="next" aria-label="Keyingi video">↓</button>
          <button class="feed-nav__more" type="button" data-jump aria-label="Bo‘limlarga o‘tish"><span aria-hidden="true">⬇</span> Bo‘limlar</button>
        </div>
        <div class="feed-overlay" id="overlay" hidden></div>
        <button class="reels-jump" type="button" data-jump aria-label="Bo‘limlarga o‘tish">Bo‘limlar <span aria-hidden="true">⬇</span></button>
      </div>
    </div>

    <!-- Pastdagi bo'limlar -->
    <div id="below">
      <!-- Mehmonlar uchun -->
      <section class="wrap" id="hero" hidden>
        <div class="hero">
          <div>
            <h1>Bolajonlar uchun xavfsiz multfilmlar</h1>
            <p class="lead">Reklamasiz va ota-ona nazorati bilan. 2–6 yoshli bolalar uchun.</p>
            <div class="hero__actions">
              <a class="btn btn--big" href="/profile">Ota-onalar uchun kirish</a>
              <a class="btn btn--big btn--ghost" href="/pro">Pro obuna haqida</a>
            </div>
          </div>
          <div class="scene" id="scene" aria-hidden="true"></div>
        </div>
      </section>

      <!-- Kirgan foydalanuvchi uchun -->
      <div class="wrap greeting" id="greeting" hidden data-peek="orange"></div>

      <div class="wrap">
        <div id="notice"></div>

        <section class="block" id="picker-block" hidden>
          <h2><span class="h-ico" aria-hidden="true">👋</span>Kim tomosha qiladi?</h2>
          <div class="kids" id="picker"></div>
        </section>

        <section class="block" id="cats-block" hidden>
          <h2 class="sr-only">Bo‘limlar</h2>
          <div class="tiles" id="tiles"></div>
        </section>

        <section class="block" id="recent-block" hidden>
          <h2><span class="h-ico" aria-hidden="true">🕘</span>Yaqinda ko‘rilganlar</h2>
          <div class="sgrid" id="recent"></div>
        </section>

        <section class="block" id="channels-block" hidden>
          <h2><span class="h-ico" aria-hidden="true">⭐</span>Kanallar</h2>
          <div class="bubbles" id="channels"></div>
        </section>

        <section class="block">
          <div class="section-head">
            <h2><span class="h-ico" aria-hidden="true">✨</span>Yangi videolar</h2>
            <a class="btn btn--small btn--ghost" href="/shorts">Hammasi</a>
          </div>
          <div class="sgrid" id="latest" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
