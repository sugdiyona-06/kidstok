# Render.com "Blueprint": New + → Blueprint orqali shu repodan avtomatik sozlanadi
services:
  - type: web
    name: nurchashma
    runtime: node
    plan: free            # Sinov uchun. Doimiy ishlashi kerak bo'lsa "starter" ga o'tkazing
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false       # qiymatni Render Dashboard'da o'zingiz kiritasiz
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRO_CONTACT_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: PRICE_30
        sync: false
      - key: PRICE_90
        sync: false
      - key: PRICE_365
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_TEST
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_MAX
        sync: false
